  <circle cx="270" cy="140" r="14" fill="#E23E57" stroke="#7C1823" stroke-width="3"/>
  <!-- Character Badge -->
  <rect x="160" y="320" width="80" height="60" rx="10" fill="#FFFFFF" stroke="#000000" stroke-width="2.5"/>
