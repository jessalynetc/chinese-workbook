<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 612 792" width="612pt" height="792pt">
  <rect width="612" height="792" fill="#FFFFFF"/>
  <!-- Print boundary guide safe box (margin 40pt) -->
  <rect x="40" y="36" width="532" height="720" fill="none" stroke="#EEEEEE" stroke-width="1"/>
  <text x="306" y="70" text-anchor="middle" font-size="22" font-weight="bold">【汉字笔顺大闯关】核心字：日</text>
  <text x="306" y="96" text-anchor="middle" font-size="13" fill="#666666">请用手指或蜡笔按照数字①②③的顺序描红，探索笔画轨迹！</text>
  <!-- Main Large Tracing Glyph -->
  <rect x="156" y="140" width="300" height="300" rx="16" fill="#FBFBFB" stroke="#000000" stroke-width="3"/>
  <line x1="156" y1="290" x2="456" y2="290" stroke="#DDDDDD" stroke-width="1.5" stroke-dasharray="6,4"/>
  <line x1="306" y1="140" x2="306" y2="440" stroke="#DDDDDD" stroke-width="1.5" stroke-dasharray="6,4"/>
  <text x="306" y="330" text-anchor="middle" font-size="190" font-weight="bold" fill="none" stroke="#222222" stroke-width="4" stroke-dasharray="10,6">日</text>
  <!-- Tracing Order Badges -->
  <circle cx="210" cy="200" r="16" fill="#000000"/>
  <text x="210" y="206" text-anchor="middle" font-size="14" fill="#FFFFFF" font-weight="bold">①</text>
  <circle cx="306" cy="180" r="16" fill="#000000"/>
  <text x="306" y="186" text-anchor="middle" font-size="14" fill="#FFFFFF" font-weight="bold">②</text>
