    <line x1="130" y1="490" x2="130" y2="590" stroke="#E0E0E0" stroke-width="1" stroke-dasharray="4,4"/>
    <text x="130" y="560" text-anchor="middle" font-size="64" fill="none" stroke="#AAAAAA" stroke-width="2" stroke-dasharray="5,4">日</text>
    <rect x="195" y="490" width="100" height="100" fill="#FFFFFF" stroke="#000000" stroke-width="2"/>
    <line x1="195" y1="540" x2="295" y2="540" stroke="#E0E0E0" stroke-width="1" stroke-dasharray="4,4"/>
    <line x1="245" y1="490" x2="245" y2="590" stroke="#E0E0E0" stroke-width="1" stroke-dasharray="4,4"/>
    <text x="245" y="560" text-anchor="middle" font-size="64" fill="none" stroke="#AAAAAA" stroke-width="2" stroke-dasharray="5,4">日</text>
    <rect x="310" y="490" width="100" height="100" fill="#FFFFFF" stroke="#000000" stroke-width="2"/>
    <line x1="310" y1="540" x2="410" y2="540" stroke="#E0E0E0" stroke-width="1" stroke-dasharray="4,4"/>
    <line x1="360" y1="490" x2="360" y2="590" stroke="#E0E0E0" stroke-width="1" stroke-dasharray="4,4"/>
    <text x="360" y="560" text-anchor="middle" font-size="64" fill="none" stroke="#AAAAAA" stroke-width="2" stroke-dasharray="5,4">日</text>
